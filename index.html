<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<title>Jupiter AI</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" crossorigin>
<script>

if (!window.crossOriginIsolated && window.isSecureContext && 'serviceWorker' in navigator) {
  navigator.serviceWorker.register('coi-serviceworker.js')
    .then(() => navigator.serviceWorker.ready)
    .then(() => {
      let done = false;
      try { done = sessionStorage.getItem('coiReloaded') === '1'; sessionStorage.setItem('coiReloaded', '1'); } catch {}
      if (!done) location.reload();
    })
    .catch(() => {});
}
</script>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#8a8a8a;--line:#e3e3e3;--soft:#f3f3f3;--code:#f7f7f7;--accent:#111;--col:760px}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:15px/1.6 "Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif}

header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px 10px;background:var(--bg)}
h1{margin:0;font-size:17px;font-weight:600}
#new{background:#fff;color:var(--fg);border:1px solid #e5e5e5;border-radius:15px;padding:5px 14px;font-size:13px}
#new:not(:disabled):hover{background:#f5f5f5;opacity:1}

#status{display:flex;flex-direction:column;align-items:center;gap:6px}
#bar{width:100%;height:3px;background:#eee;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s ease-out}
#info{color:var(--mut);font-size:13px;padding:0 16px 5px;text-align:center}

main{flex:1;min-height:0;overflow-y:auto;padding:24px max(16px,calc((100% - var(--col)) / 2));display:flex;flex-direction:column;gap:14px;scrollbar-width:thin;scrollbar-color:#dcdcdc transparent}
main::-webkit-scrollbar{width:8px}
main::-webkit-scrollbar-thumb{background:#dcdcdc;border-radius:4px}
main::-webkit-scrollbar-thumb:hover{background:#bdbdbd}
#welcome{margin:16vh 0 12px;text-align:center;font-size:28px;font-weight:500;color:#111}
#chat:has(.msg.user) #welcome{display:none}
.msg{max-width:100%;white-space:pre-wrap;word-break:break-word;animation:pop .28s cubic-bezier(.2,.8,.2,1)}
.msg.user{align-self:flex-end;max-width:75%;background:var(--soft);border-radius:18px;padding:10px 16px}
.msg.bot{align-self:stretch;padding:2px}
.msg.thinking{color:var(--mut);font-size:14px}
.msg.err{align-self:flex-start;background:#fff5f5;border:1px solid #f3d0d3;color:#cf222e;border-radius:12px;padding:6px 12px;font-size:13px}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.md{white-space:normal}

.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md p,.md ul,.md ol,.md pre,.md blockquote,.md table{margin:0 0 .8em}
.md h1,.md h2,.md h3,.md h4{margin:1em 0 .45em;line-height:1.3;font-weight:600}
.md h1{font-size:1.35em}.md h2{font-size:1.2em}.md h3{font-size:1.08em}.md h4{font-size:1em}
.md ul,.md ol{padding-left:1.4em}.md li{margin:.2em 0}
.md a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.md code{font:.88em/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,"D2Coding",monospace;background:var(--soft);padding:.12em .38em;border-radius:5px}
.md pre{background:var(--code);border:1px solid #ececec;padding:12px 14px;border-radius:12px;overflow-x:auto}
.md pre code{padding:0;background:none;white-space:pre}
.md blockquote{border-left:3px solid #dcdcdc;padding-left:12px;color:#555}
.md table{border-collapse:collapse;display:block;overflow-x:auto}
.md th,.md td{border:1px solid #e5e5e5;padding:6px 10px}.md th{background:#fafafa;font-weight:600}
.md hr{border:0;border-top:1px solid #ececec;margin:1em 0}

footer{position:relative;padding:8px max(16px,calc((100% - var(--col)) / 2)) 18px;background:var(--bg)}
#form{display:flex;flex-direction:column;gap:6px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:14px 12px 10px 18px;box-shadow:0 2px 24px rgba(0,0,0,.09);transition:border-color .2s}
#form:focus-within{border-color:#cfcfcf}
textarea{width:100%;resize:none;max-height:200px;border:0;background:transparent;color:var(--fg);padding:2px;font:inherit;outline:none}
textarea::placeholder{color:#a3a3a3}
.tools{display:flex;justify-content:flex-end;align-items:center;gap:8px}
#attach{margin-right:auto;width:34px;height:34px;padding:0;border-radius:17px;background:#fff;color:var(--fg);border:1px solid #e5e5e5;font-size:20px;font-weight:400;line-height:32px}
#attach:not(:disabled):hover{background:#f5f5f5;opacity:1}
#thumbs{display:flex;flex-wrap:wrap;gap:8px;padding-top:4px}
#thumbs:empty{display:none}
.thumb{position:relative;width:64px;height:64px}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.thumb button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;padding:0;border-radius:10px;font-size:12px;line-height:20px}
.msg.user img{display:block;max-width:220px;max-height:220px;border-radius:12px;margin-bottom:6px}

button{background:var(--accent);color:#fff;border:0;border-radius:20px;padding:10px 18px;cursor:pointer;font:inherit;transition:opacity .2s,transform .5s cubic-bezier(.34,2,.5,1),background-color .2s,color .2s,border-color .2s;-webkit-tap-highlight-color:transparent}
button:not(:disabled):hover{opacity:.85}
button:not(:disabled):active{transform:scale(.82);transition-duration:.2s,0s}
button{position:relative}
button::after{content:'';position:absolute;inset:0}
button:not(:disabled):active::after{transform:scale(1.22)}
button:disabled{opacity:.5;cursor:default}
#send,#stop{width:34px;height:34px;padding:0;border-radius:17px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;line-height:34px}
#stop{font-size:12px}
#send:disabled,#form:has(textarea:placeholder-shown) #send{background:#d6d6d6;opacity:1}
#send:not(:disabled):hover,#stop:hover{background:#333;opacity:1}
#down{position:absolute;left:50%;top:-44px;margin-left:-17px;width:34px;height:34px;padding:0;border-radius:17px;background:#fff;color:var(--fg);border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.08);font-size:16px;line-height:32px}
#down:not(:disabled):hover{background:#f5f5f5;opacity:1}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.actions{display:flex;justify-content:flex-start;margin-top:8px}
.copy{background:transparent;color:var(--mut);border:1px solid #e5e5e5;border-radius:999px;padding:2px 10px;font-size:12px}
.copy:not(:disabled):hover{color:var(--fg);background:#f5f5f5;opacity:1}
.md .code{position:relative;margin:0 0 .8em}
.md .code pre{margin:0;padding-right:56px}
.md .code .copy{position:absolute;top:7px;right:7px;background:#fff}

.ad{margin-top:12px;white-space:normal;font-style:normal;font-size:13px;color:#555}
.ad hr{border:0;border-top:1px solid #ececec;margin:8px 0}
.ad-tag{color:var(--mut);font-size:12px;margin-left:6px}
.ad a{color:inherit;text-decoration:underline;font-size:13px;word-break:break-all}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
<h1>Jupiter AI</h1>
<button id="new" type="button">새 대화</button>
</header>
<div id="status">
<div id="bar"><i></i></div>
<span id="info">로딩 중...</span>
</div>

<main id="chat"><div id="welcome">무엇을 도와드릴까요?</div></main>

<footer>
<button id="down" type="button" title="맨 아래로" hidden>↓</button>
<form id="form">
<div id="thumbs"></div>
<input id="file" type="file" accept="image/*" multiple hidden>
<textarea id="input" rows="1" placeholder="메시지를 입력하세요"></textarea>
<div class="tools">
<button id="attach" type="button" title="이미지 첨부" hidden>+</button>
<button id="send" type="submit" title="보내기" disabled>↑</button>
<button id="stop" type="button" title="중지" hidden>■</button>
</div>
</form>
</footer>

<script type="module">
import { Wllama } from 'https://cdn.jsdelivr.net/npm/@wllama/wllama@3.8.1/esm/index.js';
import { marked } from 'https://cdn.jsdelivr.net/npm/marked@15.0.12/+esm';
import DOMPurify from 'https://cdn.jsdelivr.net/npm/dompurify@3.2.6/+esm';

marked.setOptions({ gfm: true, breaks: true });
DOMPurify.addHook('afterSanitizeAttributes', n => { if (n.tagName === 'A') { n.target = '_blank'; n.rel = 'noopener noreferrer'; } });
const md = text => DOMPurify.sanitize(marked.parse(text));

const MODEL_URL = 'https://huggingface.co/jupiter-ai/Jupiter-V3/resolve/main/ai.gguf';
const MODEL_FILE = 'ai.gguf';
const MMPROJ_URL = 'https://huggingface.co/jupiter-ai/Jupiter-V3/resolve/main/mmproj.gguf';
const MMPROJ_FILE = 'mmproj.gguf';
const IMG_MAX = 768;
let vision = false;
const CORES = navigator.hardwareConcurrency || 4;

const AD = { text: '이곳에 월 1만원으로 독점 광고하기', url: 'mailto:minupark@anplick.com' };

const $ = id => document.getElementById(id);
const chat = $('chat'), input = $('input');
const newWllama = () => new Wllama({
  default: 'https://cdn.jsdelivr.net/npm/@wllama/wllama@3.8.1/esm/wasm/wllama.wasm'
}, { suppressNativeLog: true });
let wllama = newWllama();
let device = 'CPU';
let ctrl = null;
let history = [];


async function opfsDir() {
  try { return await (await navigator.storage.getDirectory()).getDirectoryHandle('pro2', { create: true }); }
  catch { return null; }
}
async function fetchFile(url, name, onProg) {
  const dir = await opfsDir();
  if (dir) {

    try {
      await dir.getFileHandle(name + '.done');
      const f = await (await dir.getFileHandle(name)).getFile();
      let remote = 0;
      try { remote = +(await fetch(url, { method: 'HEAD' })).headers.get('content-length') || 0; } catch {}
      if (!remote || remote === f.size) { onProg(f.size, f.size); return f; }
      await dir.removeEntry(name + '.done');
    } catch {}
  }
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${name}: HTTP ${res.status}`);
  const total = +res.headers.get('content-length') || 0;
  const reader = res.body.getReader();
  let loaded = 0, writable = null, chunks = [];
  if (dir) { try { writable = await (await dir.getFileHandle(name, { create: true })).createWritable(); } catch {} }
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    loaded += value.byteLength;
    writable ? await writable.write(value) : chunks.push(value);
    onProg(loaded, total);
  }
  if (writable) {
    await writable.close();
    await dir.getFileHandle(name + '.done', { create: true });
    return (await dir.getFileHandle(name)).getFile();
  }
  return new Blob(chunks);
}

async function loadModel() {
  try {
    const modelBlob = await fetchFile(MODEL_URL, MODEL_FILE, (l, t) => {
      const p = t ? Math.round(l / t * 100) : 0;
      $('bar').firstElementChild.style.width = p + '%';
      $('info').textContent = `(1/2) AI 모델 다운로드 중... (최초 1회) ${(l / 1e6).toFixed(0)} / ${(t / 1e6).toFixed(0)} MB (${p}%)`;
    });
    $('info').textContent = '준비 중…';
    let mmprojBlob = null;
    try {
      mmprojBlob = await fetchFile(MMPROJ_URL, MMPROJ_FILE, (l, t) => {
        const p = t ? Math.round(l / t * 100) : 0;
        $('bar').firstElementChild.style.width = p + '%';
        $('info').textContent = `(2/2) 이미지 인식 모델 다운로드 중... (최초 1회) ${(l / 1e6).toFixed(0)} / ${(t / 1e6).toFixed(0)} MB (${p}%)`;
      });
    } catch (e) { console.warn('mmproj 없음 → 텍스트 전용', e); }
    $('info').textContent = '준비 중…';
    const files = mmprojBlob ? [modelBlob, mmprojBlob] : [modelBlob];
    const load = async gpu => {
      await wllama.loadModel(files, {
        n_ctx: 65536,
        n_batch: 2048,
        n_ubatch: 256,
        n_threads: gpu ? Math.min(4, CORES) : Math.min(8, CORES),
        n_gpu_layers: gpu ? 999 : 0,
        ...(gpu ? {} : { no_kv_offload: true }),
        cache_type_k: 'q5_1',
        cache_type_v: 'q4_1',
        flash_attn: true
      });
      await wllama.createChatCompletion({ messages: [{ role: 'user', content: 'hi' }], max_tokens: 1, chat_template_kwargs: { enable_thinking: false } });
    };
    let gpuOk = false;
    if (navigator.gpu) {
      $('info').textContent = '준비 중… (GPU)';
      try { await load(true); gpuOk = true; }
      catch (e) {
        console.warn('GPU 실패 → CPU로 전환', e);
        try { await wllama.exit(); } catch {}
        wllama = newWllama();
      }
    }
    if (!gpuOk) { $('info').textContent = '준비 중… (CPU)'; await load(false); }
    device = gpuOk ? 'GPU' : 'CPU';
    vision = !!mmprojBlob;
    $('attach').hidden = !vision;
    $('status').remove();
    $('send').disabled = false;
    input.focus();
    addMsg('bot thinking', 'Jupiter-V3 준비 완료! 메시지를 입력해 대화할 수 있어요.');
  } catch (e) {
    console.error(e);
    $('bar').remove();
    $('info').textContent = '불러오지 못했어요. 새로고침해 주세요.';
  }
}

loadModel();

let pending = [];
async function shrink(file) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, IMG_MAX / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  g.drawImage(bmp, 0, 0, c.width, c.height);
  bmp.close();
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.9));
}
function drawThumbs() {
  $('thumbs').replaceChildren(...pending.map((b, i) => {
    const d = document.createElement('div'); d.className = 'thumb';
    const img = document.createElement('img'); img.src = URL.createObjectURL(b);
    const x = document.createElement('button'); x.type = 'button'; x.textContent = '×'; x.title = '빼기';
    x.onclick = () => { pending.splice(i, 1); drawThumbs(); };
    d.append(img, x); return d;
  }));
}
async function addImages(files) {
  if (!vision) return;
  for (const f of files) {
    if (!f.type.startsWith('image/')) continue;
    try { pending.push(await shrink(f)); } catch (e) { console.warn(e); }
  }
  drawThumbs(); input.focus();
}
$('attach').onclick = () => $('file').click();
$('file').onchange = e => { addImages([...e.target.files]); e.target.value = ''; };
input.addEventListener('paste', e => {
  const fs = [...e.clipboardData.files];
  if (vision && fs.some(f => f.type.startsWith('image/'))) { e.preventDefault(); addImages(fs); }
});
$('form').addEventListener('dragover', e => { if (vision) e.preventDefault(); });
$('form').addEventListener('drop', e => { if (!vision) return; e.preventDefault(); addImages([...e.dataTransfer.files]); });
const toMessages = h => Promise.all(h.map(async m => m.images
  ? { role: m.role, content: [...await Promise.all(m.images.map(async b => ({ type: 'image', data: await b.arrayBuffer() }))), { type: 'text', text: m.content }] }
  : { role: m.role, content: m.content }));

function addMsg(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  return d;
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return; } catch {}
  const t = document.createElement('textarea');
  t.value = text; t.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove();
}
function copyBtn(getText) {
  const b = document.createElement('button');
  b.className = 'copy'; b.type = 'button'; b.textContent = '복사';
  b.onclick = async () => {
    await copyText(getText());
    b.textContent = '복사됨'; clearTimeout(b._t); b._t = setTimeout(() => b.textContent = '복사', 1500);
  };
  return b;
}
function addCopy(el, text) {
  const wrap = document.createElement('div');
  wrap.className = 'actions'; wrap.appendChild(copyBtn(() => text)); el.appendChild(wrap);
}
function addCodeCopy(el) {
  for (const pre of el.querySelectorAll('pre')) {
    const wrap = document.createElement('div');
    wrap.className = 'code';
    pre.replaceWith(wrap); wrap.append(pre, copyBtn(() => (pre.querySelector('code') ?? pre).textContent));
  }
}
function addAd(el) {
  const ad = document.createElement('div');
  ad.className = 'ad';
  const line = document.createElement('div');
  const tag = document.createElement('span');
  tag.className = 'ad-tag'; tag.textContent = '(광고)';
  line.append(AD.text, tag);
  const a = document.createElement('a');
  a.href = AD.url; a.textContent = '자세히 알아보기'; a.target = '_blank'; a.rel = 'noopener noreferrer sponsored';
  ad.append(document.createElement('hr'), line, a, document.createElement('hr'));
  el.appendChild(ad);
}
const render = (el, text) => { el.innerHTML = md(text); addCodeCopy(el); };
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px'; });
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('form').requestSubmit(); }
});
const stop = () => {
  if (!ctrl || ctrl.signal.aborted) return;
  ctrl.abort();
  $('stop').hidden = true; $('send').hidden = false;
};
$('stop').addEventListener('pointerdown', e => { e.preventDefault(); stop(); });
$('stop').onclick = stop;
document.addEventListener('touchstart', () => {}, { passive: true });

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const imgs = pending;
  const text = input.value.trim() || (imgs.length ? '이 이미지를 설명해 주세요.' : '');
  if (!text || $('send').disabled || ctrl) return;
  pending = []; drawThumbs();
  const hist = history;

  hist.push(imgs.length ? { role: 'user', content: text, images: imgs } : { role: 'user', content: text });
  const um = addMsg('user', text);
  um.prepend(...imgs.map(b => Object.assign(document.createElement('img'), { src: URL.createObjectURL(b) })));
  input.value = ''; input.style.height = 'auto';

  const out = addMsg('bot thinking', '(생각하는 중...)');
  let acc = '', held = '', state = 0;
  const feed = s => {
    for (const ch of s) {
      if (state === 0) { if (ch === '<') { held = ch; state = 1; } else acc += ch; }
      else if (state === 1) {
        if (ch === '|') { held += ch; state = 2; }
        else { acc += held; held = ''; state = 0; feed(ch); }
      }
      else if (state === 2) { held += ch; if (ch === '|') state = 3; }
      else { held += ch; state = ch === '>' ? 0 : ch === '|' ? 3 : 2; if (state === 0) held = ''; }
    }
  };
  const flush = () => { acc += held; held = ''; state = 0; };
  const clean = () => acc.replace(/<think>[\s\S]*?(<\/think>|$)/g, '').trim();
  const my = ctrl = new AbortController();
  $('send').hidden = true; $('stop').hidden = false;
  const aborted = new Promise(r => ctrl.signal.addEventListener('abort', () => r({ done: true }), { once: true }));
  const quiet = p => { p.catch(() => {}); return p; };
  let raf = 0;
  const paint = () => {
    raf = 0;
    const c = clean();
    const stick = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 40;
    if (c) render(out, c); else out.textContent = '(생각하는 중...)';
    out.classList.toggle('thinking', !c);
    out.classList.toggle('md', !!c);
    if (stick) chat.scrollTop = chat.scrollHeight;
  };
  try {
    const stream = await Promise.race([quiet(wllama.createChatCompletion({
      messages: await toMessages(hist), stream: true,
      temperature: 0.6, top_p: 0.75, top_k: 20,
      chat_template_kwargs: { enable_thinking: false },
      abortSignal: ctrl.signal
    })), aborted]);
    const it = ctrl.signal.aborted ? null : stream[Symbol.asyncIterator]();
    while (it) {
      const { done, value } = await Promise.race([quiet(it.next()), aborted]);
      if (done || ctrl.signal.aborted) break;
      feed(value.choices[0]?.delta?.content ?? '');
      if (!raf) raf = requestAnimationFrame(paint);
    }
    cancelAnimationFrame(raf);
    flush(); paint();
    hist.push({ role: 'assistant', content: clean() });
  } catch (err) {
    if (err.name === 'AbortError' || err.name === 'WllamaAbortError') {
      flush();
      hist.push({ role: 'assistant', content: clean() });
    } else {
      out.classList.add('err'); out.classList.remove('md');
      console.error(err);
      out.textContent = '대화 길이가 길어서 답변을 만들지 못했어요. 새로고침 해 주세요.';
      hist.pop();
    }
  } finally {
    if (out.classList.contains('err') || clean()) out.classList.remove('thinking');
    if (!out.classList.contains('err') && clean()) {
      addCopy(out, clean());
      addAd(out);
    }
    if (ctrl === my) { $('send').hidden = false; $('stop').hidden = true; ctrl = null; }
  }
});
const welcome = $('welcome');
$('new').onclick = () => {
  stop(); ctrl = null;
  $('send').hidden = false; $('stop').hidden = true;
  history = []; pending = []; drawThumbs();
  chat.replaceChildren(welcome);
  input.focus();
};
const down = $('down');
chat.addEventListener('scroll', () => { down.hidden = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 40; }, { passive: true });
down.onclick = () => chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
</script>
